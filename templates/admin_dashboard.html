<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .nav-link { display: inline-block; padding: 12px 20px; margin: 10px 10px 10px 0; background-color: #17a2b8; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .nav-link:hover { background-color: #138496; }
        .logout-btn { display: inline-block; margin-top: 20px; color: #dc3545; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Administrator Dashboard</h1>
        <p>Welcome, <strong>{{ session.username }}</strong>!</p>
        <hr>
        <h3>Admin Actions:</h3>
        <div>
            <a class="nav-link" href="/add_exam">Create New Exam</a>
            <a class="nav-link" href="/add_question">Add Questions to Exam</a>
            <a class="nav-link" href="/results">View All Student Results</a>
        </div>
        <br>
        <a class="logout-btn" href="/logout">Logout</a>
    </div>
</body>
</html>
