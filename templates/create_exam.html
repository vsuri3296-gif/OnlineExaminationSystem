<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Exam</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        input[type="text"] { width: 100%; padding: 10px; margin: 10px 0 20px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create New Exam</h2>
        <form action="/add_exam" method="POST">
            <label for="title">Exam Title / Subject Name:</label>
            <input type="text" id="title" name="title" placeholder="e.g. Python Programming 101" required>
            <button type="submit">Create Exam</button>
        </form>
        <br><br>
        <a href="/admin">Back to Dashboard</a>
    </div>
</body>
</html>
