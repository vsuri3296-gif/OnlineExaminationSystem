<!DOCTYPE html>
<html>
<head>
    <title>Create New Exam</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 40px;
        }

        .container {
            width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
        }

        .message {
            color: red;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Create New Exam</h2>

    {% if message %}
        <p class="message">{{ message }}</p>
    {% endif %}

    <form method="POST">

        <label>Exam Name</label>
        <input
            type="text"
            name="title"
            placeholder="Enter exam name"
            required
        >

        <label>Time Limit (Minutes)</label>
        <input
            type="number"
            name="duration"
            min="1"
            value="60"
            required
        >

        <button type="submit">
            Create Exam
        </button>

    </form>

    <a class="back" href="{{ url_for('admin_dashboard') }}">
        Back to Admin Dashboard
    </a>

</div>

</body>
</html>
