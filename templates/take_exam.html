<!DOCTYPE html>
<html>
<head>
    <title>{{ exam["title"] }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .timer {
            background: #dc3545;
            color: white;
            padding: 12px 18px;
            border-radius: 6px;
            font-size: 20px;
            font-weight: bold;
        }

        .question {
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .option {
            display: block;
            margin: 12px 0;
            padding: 8px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <div>
            <h2>{{ exam["title"] }}</h2>

            <p>
                Time Limit:
                {{ exam["duration"] }} minutes
            </p>
        </div>

        <div class="timer">
            Time Left:
            <span id="timer">00:00</span>
        </div>

    </div>


    <form
        id="examForm"
        method="POST"
        action="{{ url_for('submit_exam', exam_id=exam['id']) }}"
    >

        {% if questions %}

            {% for q in questions %}

                <div class="question">

                    <h3>
                        Question {{ loop.index }}
                    </h3>

                    <p>
                        <strong>
                            {{ q["question"] }}
                        </strong>
                    </p>


                    <label class="option">
                        <input
                            type="radio"
                            name="question_{{ q['id'] }}"
                            value="1"
                            required
                        >
                        {{ q["option1"] }}
                    </label>


                    <label class="option">
                        <input
                            type="radio"
                            name="question_{{ q['id'] }}"
                            value="2"
                        >
                        {{ q["option2"] }}
                    </label>


                    <label class="option">
                        <input
                            type="radio"
                            name="question_{{ q['id'] }}"
                            value="3"
                        >
                        {{ q["option3"] }}
                    </label>


                    <label class="option">
                        <input
                            type="radio"
                            name="question_{{ q['id'] }}"
                            value="4"
                        >
                        {{ q["option4"] }}
                    </label>

                </div>

            {% endfor %}

        {% else %}

            <p>
                No questions are available for this exam.
            </p>

        {% endif %}


        {% if questions %}

            <button
                type="submit"
                class="submit-btn"
            >
                Submit Exam
            </button>

        {% endif %}

    </form>

</div>


<script>

    // Duration comes from the exam database.
    let durationMinutes = Number(
        "{{ exam['duration'] }}"
    );

    let totalSeconds = durationMinutes * 60;

    const timerElement =
        document.getElementById("timer");

    const examForm =
        document.getElementById("examForm");


    function updateTimer() {

        let minutes =
            Math.floor(totalSeconds / 60);

        let seconds =
            totalSeconds % 60;


        let minuteText =
            String(minutes).padStart(2, "0");

        let secondText =
            String(seconds).padStart(2, "0");


        timerElement.textContent =
            minuteText + ":" + secondText;


        if (totalSeconds <= 0) {

            clearInterval(timerInterval);

            alert(
                "Time is over. Your exam will be submitted automatically."
            );

            examForm.submit();

            return;
        }


        totalSeconds--;
    }


    updateTimer();


    const timerInterval =
        setInterval(updateTimer, 1000);

</script>

</body>
</html>
